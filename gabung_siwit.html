<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gabung 3×3</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#fff;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#board{position:relative;width:min(100vw,100vh);width:min(100vw,100dvh);aspect-ratio:1;touch-action:none}
#grid{position:absolute;inset:0}
.tile{position:absolute;width:33.3333%;height:33.3333%;padding:2.2%;touch-action:none;cursor:grab}
.tile img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%;pointer-events:none;-webkit-user-drag:none}
.tile.moving{transition:left .11s linear,top .11s linear}
.tile.drag{z-index:10;cursor:grabbing;transition:none}
.tile.drag img{filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.tile.sel img{filter:drop-shadow(0 0 5px rgba(0,0,0,.4))}
.tile.spawn img{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
